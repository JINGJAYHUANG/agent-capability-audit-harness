name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: acah-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Compile
        run: python -m compileall -q src scripts tests examples/command-adapter

      - name: Enforce test floor
        run: python scripts/verify_test_count.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify public examples
        run: python scripts/verify_public_examples.py

      - name: Audit public boundary
        run: python scripts/public_audit.py .

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

  reproducible-wheel:
    name: Reproducible wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build

      - name: Build twice with fixed epoch
        env:
          SOURCE_DATE_EPOCH: "1788050814"
        run: |
          set -euo pipefail
          rm -rf build src/*.egg-info dist-a dist-b
          python -m build --wheel --outdir dist-a
          rm -rf build src/*.egg-info
          python -m build --wheel --outdir dist-b
          cmp dist-a/*.whl dist-b/*.whl
          sha256sum dist-a/*.whl dist-b/*.whl
