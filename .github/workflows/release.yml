name: Release

on:
  push:
    branches: [main]
    paths:
      - ".release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v, for example 0.1.0
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: acah-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${REQUESTED_VERSION#v}"
          else
            marker="$(ls .release/v* | sort | tail -n1)"
            version="${marker##*/v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid semantic version: $version" >&2; exit 64; }
          package_version="$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('pyproject.toml').read_text()
          print(re.search(r'^version = "([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          test "$version" = "$package_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install package and build tooling
        run: python -m pip install --disable-pip-version-check . build

      - name: Re-run release gates
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests examples/command-adapter
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          python scripts/verify_public_examples.py
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py

      - name: Create or verify immutable tag through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_DATE_EPOCH: "1788050814"
        run: |
          set -euo pipefail
          rm -rf release-dist build src/*.egg-info
          mkdir -p release-dist
          python -m build --wheel --outdir release-dist
          git archive --format=tar --prefix="agent-capability-audit-harness-${VERSION}/" HEAD > release-dist/source.tar
          gzip -n -9 release-dist/source.tar
          mv release-dist/source.tar.gz "release-dist/agent-capability-audit-harness-${VERSION}.tar.gz"
          git archive --format=zip --prefix="agent-capability-audit-harness-${VERSION}/" HEAD > "release-dist/agent-capability-audit-harness-${VERSION}.zip"
          cp examples/synthetic/capability-contract.json release-dist/CAPABILITY_CONTRACT.json
          cp examples/synthetic/golden-suite.json release-dist/GOLDEN_SUITE.json
          cp examples/synthetic/expected/reference-run/summary.json release-dist/REFERENCE_SUMMARY.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from acah.verify import verify_run
          root = Path('examples/synthetic/expected/reference-run')
          result = verify_run(root).to_dict()
          Path('release-dist/RUN_VERIFICATION.json').write_text(json.dumps(result, sort_keys=True, separators=(',', ':')) + '\n')
          provenance = {
              'schema_version': '1.0',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'version': os.environ['VERSION'],
              'test_floor': 180,
              'golden_cases': 8,
              'golden_actions': 21,
              'declared_capabilities': 16,
              'runtime_claim': 'harness-validated; command transport is not a sandbox',
          }
          Path('release-dist/RELEASE_PROVENANCE.json').write_text(json.dumps(provenance, sort_keys=True, separators=(',', ':')) + '\n')
          PY
          (cd release-dist && sha256sum *.gz *.zip *.whl *.json | sort > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* --clobber
          else
            gh release create "$TAG" release-dist/* \
              --verify-tag \
              --title "Agent Capability Audit Harness ${TAG}" \
              --notes "Deny-by-default capability contracts, eight Golden Tasks, compliant and negative-control adapters, hash-chained evidence, 184 tests, and deterministic release verification. Command adapters remain explicit and are not sandboxes."
          fi
