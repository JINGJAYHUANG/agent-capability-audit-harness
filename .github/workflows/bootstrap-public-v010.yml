name: Bootstrap public v0.1.0

on:
  push:
    branches: [feat/public-v0.1.0]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-public-v010.yml"

permissions:
  contents: write

concurrency:
  group: acah-bootstrap-v010
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    name: Verify archive and publish readable source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/source.tar.gz.b64.part-*)
          test "${#parts[@]}" -eq 30
          LC_ALL=C cat "${parts[@]}" > "$RUNNER_TEMP/source.tar.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/source.tar.gz.b64")" -eq 87796
          base64 --decode "$RUNNER_TEMP/source.tar.gz.b64" > "$RUNNER_TEMP/source.tar.gz"
          test "$(wc -c < "$RUNNER_TEMP/source.tar.gz")" -eq 65847
          printf '%s  %s\n' \
            'bb73dd845fdc4ffdfcffafab262d1b0678f1059c5288abb0c5ebb4b9c2d9f169' \
            "$RUNNER_TEMP/source.tar.gz" | sha256sum -c -

      - name: Safely extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          ARCHIVE="$RUNNER_TEMP/source.tar.gz" DEST="$RUNNER_TEMP/source" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          destination = Path(os.environ["DEST"]).resolve()
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  resolved = (destination / member.name).resolve()
                  if resolved != destination and destination not in resolved.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              bundle.extractall(destination, filter="data")
          PY

      - name: Run release gates on extracted source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python -m pip install --disable-pip-version-check .
          python -m compileall -q src scripts tests examples/command-adapter
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          python scripts/verify_public_examples.py
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py

      - name: Publish verified non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-public-v010.yml "$RUNNER_TEMP/bootstrap-public-v010.yml"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/." .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap-public-v010.yml" .github/workflows/bootstrap-public-v010.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish verified non-workflow source"
          git push origin HEAD:feat/public-v0.1.0
